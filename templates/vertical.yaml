# Cat-Cut 縦型動画設定 (9:16)
# TikTok / Instagram Reels / YouTube Shorts 向け

project:
  name: ""
  speaker: ""
  description: ""

text_rules:
  enumeration_style: "as_is"
  known_terms: []
  corrections: {}

telop:
  # フェーズT2: full=従来のword同期テロップ / directed=演出決定エンジン(AIパス3)による
  # スロット単位テロップ+オーバーレイ。directedのときのみ step06c_direction.py が実行される。
  mode: "full"
  # フェーズW30: 12→11字。フィット幅86%(929px)で1行11字なら84px級のフォントが縮小なしで
  # 入る(2026-08-22「文字は大きくしたい」フィードバック)。スロット分割の目標文字数も
  # この値から導出される(意味の塊分割: 目標=1行分、上限=2行分)。
  max_chars_per_line: 11
  # 改善8-A-4: 1ページ基本1行。learned_rules.json の学習値と一致。
  max_lines_per_page: 1
  # フェーズW26: ショートは動きが命(2026-08-21「動きが弱い」フィードバック)。
  # fullモードの既定を zoom/fade に(directedモードは vertical_type_styles が優先)。
  animation_in: "zoom"
  animation_out: "fade"
  y_position: 0.75
  # フェーズW30: 72→80。意味の塊分割で1テロップが短くなったぶん大きく出す
  font_size: 80

render:
  fps: 30
  width: 1080
  height: 1920
  video_fit: "cover"
  framing:
    scale: 1.0
    offset_y: 0

edit:
  max_gap_ms: 600
  lead_padding_ms: 200
  tail_padding_ms: 120
  # 改善9-A: RMSエッジリファイン (VADトリム後の振幅ベース詰め)
  edge_head_pad_ms: 80
  edge_tail_pad_ms: 150
  filler_confidence_threshold: 0.6

# BudouX DP ペナルティ (縦型最適化)
dp:
  widow: 2.5
  kinsoku: 15.0
  anchor_bonus: 2.0
  page_lone: 3.0
  page_end: 1.5
  line_max_ratio: 1.4
  page_max_ratio: 1.4
