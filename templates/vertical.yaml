# Cat-Cut 縦型動画設定 (9:16)
# TikTok / Instagram Reels / YouTube Shorts 向け

project:
  name: ""
  speaker: ""
  description: ""

text_rules:
  enumeration_style: "as_is"
  known_terms: []
  corrections: {}

telop:
  max_chars_per_line: 12
  # 改善8-A-4: 1ページ基本1行 (縦12文字目安)。learned_rules.json の学習値と一致。
  max_lines_per_page: 1
  animation_in: "none"
  animation_out: "none"
  y_position: 0.75
  font_size: 52

render:
  fps: 30
  width: 1080
  height: 1920
  video_fit: "cover"
  framing:
    scale: 1.0
    offset_y: 0

edit:
  max_gap_ms: 600
  lead_padding_ms: 200
  tail_padding_ms: 120
  # 改善9-A: RMSエッジリファイン (VADトリム後の振幅ベース詰め)
  edge_head_pad_ms: 80
  edge_tail_pad_ms: 150
  filler_confidence_threshold: 0.6

# BudouX DP ペナルティ (縦型最適化)
dp:
  widow: 2.5
  kinsoku: 15.0
  anchor_bonus: 2.0
  page_lone: 3.0
  page_end: 1.5
  line_max_ratio: 1.4
  page_max_ratio: 1.4
