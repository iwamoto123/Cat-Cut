# テロッププリセット定義
#
# 各プリセットは Telop.tsx が読み込み、ページ単位で適用される。
# composition.json の voice_data.cuts[].telops[].style に preset 名を指定する。
# style 未指定なら "default" が使われる。
#
# パラメーター:
#   font_family         : CSS font-family 文字列
#   font_size           : 数値 (px)
#   font_weight         : 数値 (100-900)
#   letter_spacing      : 文字列 (CSS, 例: "0.02em")
#   line_height         : 数値
#   fill                : 塗りつぶし
#     type              : "solid" | "gradient"
#     color             : ソリッド時の色 (hex)
#     gradient_from     : グラデ開始色
#     gradient_to       : グラデ終了色
#     gradient_direction: "vertical" | "horizontal" | "diagonal"
#   inner_stroke        : 内縁取り (オプション)
#     color             : 色
#     width             : 太さ (px)
#   outer_stroke        : 外縁取り (オプション)
#     color             : 色
#     width             : 太さ (px) ※inner_stroke より大きく
#   outer_stroke2       : 第3縁 (フェーズU6。outer_stroke のさらに外側=最背面に描画する
#     color             : 「太枠」用の縁。多重テロップの重厚感を出したいときに使う。
#     width             : 太さ (px) ※outer_stroke より大きく。null/省略で無効)
#   drop_shadow         : 影 (CSS の filter: drop-shadow() 文字列、null で無効)
#   glow                : 光彩 (フェーズU6。オフセットなしdrop-shadowの多重で表現する
#     color             : ネオン系の光。game系プリセットがdrop_shadow文字列で手書きしている
#     radius            : グロウとは独立の明示フィールド。radius は font_size 基準のpx。
#                         null/省略で無効)
#   shadow_offset       : ハードなオフセット影 (フェーズT2.5。縁レイヤーの下に(x,y)pxずらした
#     x                 : 影レイヤーを描画する。drop_shadowのぼかし影とは別物で、
#     y                 : 「細い縁+オフセット影」の商用テロップ定番表現に使う。
#     color             : x/y は font_size 基準のpx。null/省略で無効)
#   y_position_offset   : 縦位置オフセット (yaml の telop_y からの相対調整, -0.1〜0.1, 0=変更なし)
#   highlight_color     : 部分ハイライト色 (フェーズT1。telops[].highlight_words に含まれる
#                         部分文字列の塗り色。省略時は "#E7305B")
#   background          : 背景 (オプション)
#     color             : 背景色
#     borderRadius      : 角丸 (CSS文字列。従来の行ごと帯背景用)
#     padding_x         : 横パディング px (フェーズT1。指定すると「行ごとの帯」ではなく
#     padding_y         : 縦パディング px  文字ブロック全体の背後に1枚のベタ長方形を描画する)
#     border_radius     : 角丸 px (ブロック背景用)
#   animation_in        : 登場アニメーション (フェーズT3。プリセット単位の既定。
#                         "pop_big"    = 画面中央に大きく出てから定位置へ縮小移動(強調・煽り系)
#                         "slide_left" = 左からスライドイン+フェード(名言・辛辣系)
#                         "slide_up"   = 下から浮き上がる(質問系)
#                         "zoom"       = その場でズームイン(要点・オチ・CTA)
#                         "stamp"      = ハンコ(既存流用) / "fade" = フェードのみ / "none" = なし
#                         --- フェーズW24 Phase B-1(広告向け・上品な4種) ---
#                         "blur_in"     = ぼかしが解けながら浮かび上がる
#                         "typewriter"  = 1文字ずつ出る(grapheme単位。広告の定番)
#                         "wipe_up"     = 下からマスクで拭き上がる
#                         "drop_settle" = 上からストンと落ちて僅かに沈んで戻る
#                         省略時は timeline.animation_in (従来のグローバル設定) にフォールバック)
#   animation_out       : 退場アニメーション ("fade" | "pop_out" | "none"。省略時は
#                         timeline.animation_out にフォールバック)
#   animation_duration_frames : 登場アニメの長さ(フレーム数。省略時は既定12)
#   sfx                 : 登場時効果音ID (assets/sfx/ の "don"|"shakin"|"pon"|"jan"|"hyu"。
#                         null/省略で鳴らさない。連発防止のため描画側で最小間隔5秒のガードあり)
#   particle_scale      : 助詞縮小(タイポグラフィ)。内容語(漢字・カタカナ・英数字)に挟まれた
#                         単独ひらがな助詞(の・が・を等)のフォントサイズ比率。
#                         省略時 0.8 (80%)。1 で無効。判定は決定的ルール(AI不使用・トークン消費なし)
#   latin_font_family   : 和欧混植(タイポグラフィ)。半角英数字の連続に適用する欧文フォント。
#                         省略時 '-apple-system, "SF Pro Display", "Helvetica Neue", "Arial", sans-serif'
#                         (iPhone/Macのシステムフォント)。null で無効
#                         (明朝・手書き系などフォント固有の欧文を活かしたいプリセットは null にする)

presets:
  # ----- 標準テロップ (青グラデ + 多重縁取り) -----
  default:
    description: "標準テロップ。青縦グラデ+白枠+濃紺枠"
    font_family: '"Zen Kaku Gothic Antique", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif'
    font_size: 72
    font_weight: 900
    letter_spacing: "0.02em"
    line_height: 1.4
    fill:
      type: gradient
      gradient_from: "#7BB8DC"
      gradient_to: "#1E5DA8"
      gradient_direction: vertical
    inner_stroke:
      color: "#FFFFFF"
      width: 10
    outer_stroke:
      color: "#1E3A5F"
      width: 18
    drop_shadow: "drop-shadow(0px 4px 6px rgba(0,0,0,0.4))"
    y_position_offset: 0

  # ----- 強調 (派手・大きい) -----
  highlight:
    description: "重要な発言・数字・結論を強調する大きめテロップ。黄→オレンジ"
    font_family: '"Zen Kaku Gothic Antique", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Arial Black", "Meiryo", sans-serif'
    font_size: 96
    font_weight: 900
    letter_spacing: "0.02em"
    line_height: 1.3
    fill:
      type: gradient
      gradient_from: "#FFD93D"
      gradient_to: "#FF6B35"
      gradient_direction: vertical
    inner_stroke:
      color: "#FFFFFF"
      width: 12
    outer_stroke:
      color: "#7A2A00"
      width: 24
    drop_shadow: "drop-shadow(0px 6px 10px rgba(0,0,0,0.5))"
    y_position_offset: -0.05  # 強調なので少し上に

  # ----- シンプル (補助情報・引用など) -----
  simple:
    description: "シンプルな白文字+黒縁。地味なナレーションや補助テロップ向け"
    font_family: '"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif'
    font_size: 56
    font_weight: 900
    letter_spacing: "0.02em"
    line_height: 1.4
    fill:
      type: solid
      color: "#FFFFFF"
    inner_stroke:
      color: "#000000"
      width: 8
    outer_stroke: null
    drop_shadow: "drop-shadow(0px 3px 5px rgba(0,0,0,0.5))"
    y_position_offset: 0

  # ----- 落ち着き (説明・整理) -----
  calm:
    description: "落ち着いた説明・整理向け。淡い水色グラデ+白枠+深い青枠"
    font_family: '"Zen Kaku Gothic Antique", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif'
    font_size: 66
    font_weight: 900
    letter_spacing: "0.02em"
    line_height: 1.4
    fill:
      type: gradient
      gradient_from: "#D9F3FF"
      gradient_to: "#5E91B8"
      gradient_direction: vertical
    inner_stroke:
      color: "#FFFFFF"
      width: 9
    outer_stroke:
      color: "#1C3D57"
      width: 17
    drop_shadow: "drop-shadow(0px 3px 6px rgba(0,0,0,0.35))"
    y_position_offset: 0

  # ----- 警告/注意 (赤系) -----
  warning:
    description: "注意喚起・否定的な発言を強調。赤グラデ+白枠"
    font_family: '"Zen Kaku Gothic Antique", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Arial Black", "Meiryo", sans-serif'
    font_size: 80
    font_weight: 900
    letter_spacing: "0.02em"
    line_height: 1.3
    fill:
      type: gradient
      gradient_from: "#FF6B6B"
      gradient_to: "#C92A2A"
      gradient_direction: vertical
    inner_stroke:
      color: "#FFFFFF"
      width: 10
    outer_stroke:
      color: "#5C0A0A"
      width: 20
    drop_shadow: "drop-shadow(0px 4px 8px rgba(0,0,0,0.5))"
    y_position_offset: 0

  # ===========================================================================
  # フェーズT2.5-2: 縁取りデザイン原則 (演出系プリセット fact_yellow〜serif_harsh に適用)
  #
  #   原則1: 二重縁で濃色同士を隣接させない (縁の明度差 >= 0.4。リント:
  #          python/tests/test_telop_preset_lint.py が全プリセットを機械検証する)
  #   原則2: 太い第2縁の代わりに「細い縁(8〜12px級) + オフセット影(shadow_offset)」
  #          または「細い縁 + ソフト影(drop_shadow)」を基本とする
  #   定番形: 「白文字+黒細縁+ハード影」「黄文字+黒細縁」「色文字+白細縁+黒オフセット影」
  # ===========================================================================

  # ===========================================================================
  # 改善8-B-2: カラーウェイ×用途プリセット群(共通デザイン式)
  #
  # 全プリセット共通構造:
  #   font_family: Zen Kaku Gothic Antique 900 (フォールバック Hiragino Sans 等)
  #   fill: 縦グラデ(明るい色→深い色)
  #   inner_stroke: 白 8〜10px
  #   outer_stroke: 塗りと同系の濃色 16〜20px (innerより必ず太い)
  #   drop_shadow あり
  # 命名規則: "<カラーウェイ>_<用途>"。用途は standard(標準)/emphasis(強調大)/subtle(控えめ小)/
  # band(帯背景バリエーション、standardと同サイズ+半透明黒帯)。カラーウェイ12種×用途3種+帯6種=42種。
  # フラット単色1重縁のプリセットはここには作らない。
  # ===========================================================================

  # ----- ブルー (白谷塾青。defaultと同系色の独立カラーウェイファミリー) -----
  blue_standard:
    description: "ブルー・標準"
    font_family: '"Zen Kaku Gothic Antique", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif'
    font_size: 70
    font_weight: 900
    letter_spacing: "0.02em"
    line_height: 1.4
    fill: { type: gradient, gradient_from: "#7BB8DC", gradient_to: "#1E5DA8", gradient_direction: vertical }
    inner_stroke: { color: "#FFFFFF", width: 9 }
    outer_stroke: { color: "#1E3A5F", width: 18 }
    drop_shadow: "drop-shadow(0px 4px 6px rgba(0,0,0,0.4))"
    y_position_offset: 0
  blue_emphasis:
