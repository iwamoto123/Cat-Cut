  # ===========================================================================
  # フェーズT1: 参考動画テロップ8系統プリセット (telop_analysis_20260705/analysis.md)
  #
  # 配色ルール: 事実=fact_yellow(A1) / 中立・相槌=neutral_white(A2) /
  # 感情・断言=emotion_red(A3) / 質問=question_blue(A4) / 軽い返し=reply_cyan(A5) /
  # 強い煽り=special_purple(A6) / 要点・オチ=box_yellow(B) / プラン名等=box_red /
  # CTA=cta_yellow(G) / OP煽り=op_brush(D)
  # 参考画像: templates/reference/telop_analysis_20260705/telop_samples/
  # ===========================================================================

  # ----- A1: 白+黒細縁+ハード影、強調語のみ黄 (デフォルト事実) -----
  # 2026-07リサーチ反映: プロの定番は「白文字+黒縁」がベース、色は強調箇所のみ。
  # 縁は文字サイズの5〜10%(72px→6px)。フォントはテロップ用に仮名を拡大した
  # 源暎ゴシックN U-KL(超極太)へ変更。
  fact_yellow:
    description: "事実・説明のデフォルト。白+黒細縁+ハード影、強調語のみ黄"
    font_family: '"GenEi Gothic N U-KL", "Zen Kaku Gothic Antique", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif'
    font_size: 72
    font_weight: 900
    letter_spacing: "0.03em"
    line_height: 1.35
    fill: { type: solid, color: "#FFFFFF" }
    inner_stroke: null
    outer_stroke: { color: "#000000", width: 6 }
    drop_shadow: null
    shadow_offset: { x: 4, y: 4, color: "#000000" }
    y_position_offset: 0
    highlight_color: "#FFE600"
    animation_in: none  # 頻出テロップはアニメなし(チカチカ防止)
    sfx: null

