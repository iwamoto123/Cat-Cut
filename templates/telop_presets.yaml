    font_family: '"Zen Kaku Gothic Antique", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif'
    font_size: 94
    font_weight: 900
    letter_spacing: "0.02em"
    line_height: 1.3
    fill: { type: gradient, gradient_from: "#7BB8DC", gradient_to: "#1E5DA8", gradient_direction: vertical }
    inner_stroke: { color: "#FFFFFF", width: 10 }
    outer_stroke: { color: "#1E3A5F", width: 20 }
    drop_shadow: "drop-shadow(0px 6px 10px rgba(0,0,0,0.5))"
    y_position_offset: -0.05
  blue_subtle:
    description: "ブルー・控えめ小"
    font_family: '"Zen Kaku Gothic Antique", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif'
    font_size: 56
    font_weight: 900
    letter_spacing: "0.02em"
    line_height: 1.4
    fill: { type: gradient, gradient_from: "#7BB8DC", gradient_to: "#1E5DA8", gradient_direction: vertical }
    inner_stroke: { color: "#FFFFFF", width: 9 }
    outer_stroke: { color: "#1E3A5F", width: 16 }
    drop_shadow: "drop-shadow(0px 4px 6px rgba(0,0,0,0.4))"
    y_position_offset: 0
  blue_band:
    description: "ブルー・帯背景"
    font_family: '"Zen Kaku Gothic Antique", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif'
    font_size: 70
    font_weight: 900
    letter_spacing: "0.02em"
    line_height: 1.4
    fill: { type: gradient, gradient_from: "#7BB8DC", gradient_to: "#1E5DA8", gradient_direction: vertical }
    inner_stroke: { color: "#FFFFFF", width: 9 }
    outer_stroke: { color: "#1E3A5F", width: 18 }
    drop_shadow: "drop-shadow(0px 4px 6px rgba(0,0,0,0.4))"
    background: { color: "rgba(17, 17, 17, 0.62)" }
    y_position_offset: 0

  # ----- オレンジ (明#FFB347→深#E86A17、外縁焦茶) -----
  orange_standard:
    description: "オレンジ・標準"
    font_family: '"Zen Kaku Gothic Antique", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif'
    font_size: 70
    font_weight: 900
    letter_spacing: "0.02em"
    line_height: 1.4
    fill: { type: gradient, gradient_from: "#FFB347", gradient_to: "#E86A17", gradient_direction: vertical }
    inner_stroke: { color: "#FFFFFF", width: 9 }
    outer_stroke: { color: "#6B3410", width: 18 }
    drop_shadow: "drop-shadow(0px 4px 6px rgba(0,0,0,0.4))"
    y_position_offset: 0
  orange_emphasis:
    description: "オレンジ・強調大"
    font_family: '"Zen Kaku Gothic Antique", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif'
    font_size: 94
    font_weight: 900
